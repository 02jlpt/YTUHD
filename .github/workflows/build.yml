name: Build YTUHD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Theos
        uses: theos/setup-theos@v1
        with:
          theos-src: theos/theos
          theos-ref: master

      - name: Build Tweak
        run: |
          make clean package FINALPACKAGE=1

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTUHD-DEB
          path: packages/*.deb
